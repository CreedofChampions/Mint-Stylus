# Electron Builder configuration file: Directs Electron builder to produce
# packages for our officially supported distributions.
#
# Formerly the "build" key in the package.json.
appId: app.mintstylus
productName: Mint Stylus
npmRebuild: false
copyright: Mint Stylus, a fork of Zettlr, licensed under GNU GPL v3.
fileAssociations:
- ext: md
  name: Markdown
  description: Markdown document
  mimeType: text/markdown
  role: Editor
  isPackage: false
- ext: markdown
  name: Markdown
  description: Markdown document
  mimeType: text/markdown
  role: Editor
  isPackage: false
- ext: rmd
  name: RMarkdown
  description: RMarkdown document
  mimeType: text/markdown
  role: Editor
  isPackage: false
directories:
  output: release
#
# Generic macOS options
#
mac:
  category: "public.app-category.productivity"
  target:
  - dmg
  artifactName: "MintStylus-${version}-${arch}.${ext}"
  icon: "./resources/icons/icon.icns"
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "./scripts/assets/entitlements.plist"
  entitlementsInherit: "./scripts/assets/entitlements.plist"
#
# Generic Windows options
#
win:
  target:
  - nsis
  artifactName: "MintStylus-${version}-${arch}.${ext}"
  icon: "./resources/icons/icon.ico"
  # Code signing is DISABLED for Mint Stylus. The block below is the upstream
  # Zettlr Azure Trusted Signing config — it references Zettlr's cert/account
  # (publisher "Hendrik Erz", certificateProfileName "zettlr-code-sign-cert",
  # codeSigningAccountName "zettlr") which we do NOT have access to. Leaving it
  # active would break `electron-builder` on Windows. Replace the placeholder
  # values with a real Mint Stylus Azure Trusted Signing profile (and uncomment)
  # once we have one; until then builds are UNSIGNED.
  # azureSignOptions:
  #   publisherName: "REPLACE_WITH_MINT_STYLUS_PUBLISHER"
  #   endpoint: "https://neu.codesigning.azure.net/"
  #   certificateProfileName: "REPLACE_WITH_MINT_STYLUS_CERT_PROFILE"
  #   codeSigningAccountName: "REPLACE_WITH_MINT_STYLUS_ACCOUNT"
#
# Generic Linux options
#
linux:
  target:
  - AppImage
  artifactName: "MintStylus-${version}-${arch}.${ext}"
  executableName: MintStylus
  synopsis: Markdown editor
  category: Office
  icon: "./resources/icons/png"
  desktop:
    entry:
      StartupWMClass: mintstylus
#
# Configuration for DMG builds
#
dmg:
  background: "./resources/icons/dmg/dmg_back.tiff"
  icon: "./resources/icons/icon.icns"
  contents:
  - x: 130
    y: 220
  - x: 410
    y: 220
    type: link
    path: "/Applications"
  window:
    width: 540
    height: 400
#
# Configuration for NSIS builds
#
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  uninstallDisplayName: ${productName}
  installerHeader: "./resources/NSIS/NSISinstallerHeader.bmp"
  installerSidebar: "./resources/NSIS/NSISinstallerSidebar.bmp"
  license: ./LICENSE
