compressionLevel: mixed

enableGlobalCache: false

enableTelemetry: false

nodeLinker: node-modules

npmMinimalAgeGate: "7d"

# edited by AI from here — allow darwin-only optional deps (fsevents) to be
# installed on non-mac hosts so macOS builds can be cross-packaged from Linux.
supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - x64
    - arm64
